[package]
name = "sensor_data_server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-rt = "2.10.0"
actix-web = "4"
dotenvy = "0.15.7"
env_logger = "0.11.8"
log = "0.4.27"
rumqttc = "0.24.0"
sqlx = { version = "0.8.6", features = [ "runtime-tokio", "postgres", "chrono", "bigdecimal" ] }
tokio = "1.47.1"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "=0.9.8"
chrono = { version = "0.4.42", features = ["serde"] }
bigdecimal = { version = "0.4.9", features = ["serde"] }

# move into own repo or make shared by workspace
schili_api = { path = "../schili_api" }
anyhow = "1.0.100"
lettre = "0.11.21"

